<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Animal Book AR</title>
  <link rel="stylesheet" href="ar.css">
</head>
<body>
  <div id="ar"></div>

  <div id="loading" class="center-msg">
    <div class="spinner"></div>
    <p id="loading-text">Starting the camera…</p>
  </div>

  <div id="scan" class="hidden">
    <div class="frame"><span></span><span></span><span></span><span></span></div>
    <p class="hint" id="scan-hint">Point the camera at an animal page</p>
  </div>

  <div id="error" class="center-msg hidden">
    <p class="big">📷</p>
    <p id="error-text">The camera could not start.</p>
  </div>

  <!-- body parts: dots on the animal, the aim target, the selected part's name -->
  <div id="parts" class="hidden"></div>
  <div id="aim" class="hidden"><span></span></div>
  <div id="part-label" class="hidden">
    <div class="bubble">
      <span id="part-en" class="en"></span>
      <span class="row" id="part-other"></span>
    </div>
  </div>
  <div id="held-badge" class="hidden">✋ Holding: turn the phone to look around</div>

  <!-- quiz question, small rewards, big celebrations -->
  <div id="quiz" class="hidden"><span id="quiz-text"></span><span id="quiz-sub"></span></div>
  <div id="toast" class="hidden"></div>
  <div id="celebrate" class="hidden"><span>🎉</span><b id="celebrate-text"></b></div>
  <canvas id="confetti" class="hidden"></canvas>
  <button id="btn-photo" class="hidden" aria-label="Take a photo">📸</button>
  <div id="flash" class="hidden"></div>

  <div id="card" class="hidden">
    <div class="names">
      <span id="name-en" class="en"></span>
      <span id="name-fr" class="fr"></span>
      <span id="name-ar" class="ar" dir="rtl"></span>
    </div>
    <p id="fact" class="fact"></p>
    <div id="food-tray" class="hidden"></div>
    <div class="buttons">
      <button id="btn-sound" aria-label="Play the sound"><span>🔊</span>Sound</button>
      <button id="btn-move" aria-label="Change the animation"><span>🐾</span>Move</button>
      <button id="btn-feed" aria-label="Feed the animal"><span>🍽️</span>Feed</button>
      <button id="btn-hold" aria-label="Keep the animal when the page leaves the camera"><span>✋</span>Hold</button>
      <button id="btn-reset" aria-label="Reset position"><span>↺</span>Reset</button>
    </div>
    <p class="gesture-hint" id="gesture-hint">Aim the ◎ at a body part · 1 finger: turn and tip · 2 fingers: zoom, move</p>
  </div>

  <div id="debug" class="hidden"></div>

  <script type="module" src="ar.js"></script>
</body>
</html>
